name: CI

on:
  push:
    branches: [dev, main, master]
  pull_request:
    branches: [dev, main, master]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python 3.13
      uses: actions/setup-python@v6
      with:
        python-version: "3.13"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Lint with ruff
      run: |
        ruff check --output-format=github .
        ruff format --check .

    - name: Type check with mypy
      run: |
        mypy bot dashboard database services modules app.py config.py bark_version.py

    - name: Security scan with bandit
      run: |
        bandit -q -r -ll bot dashboard database services modules app.py config.py

    - name: Vulnerability scan with pip-audit
      run: |
        pip-audit

    - name: Test with pytest
      run: |
        pytest -q --tb=short

    - uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Verify generated frontend assets
      working-directory: frontend
      run: |
        npm ci
        npm run check
