[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bark"
version = "0.1.0"
description = "Discord bot and management platform for ZENHAWX"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [
    {name = "ZENHAWX Community"}
]

dependencies = [
    "discord.py>=2.5,<3.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "jinja2>=3.1,<4.0",
    "sqlalchemy>=2.0,<3.0",
    "aiofiles>=24.0,<25.0",
    "python-multipart>=0.0.18",
    "aiosqlite>=0.20,<1.0",
    "itsdangerous>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.25,<1.0",
    "httpx>=0.28,<1.0",
    "watchdog>=6.0,<7.0",
]

[tool.setuptools.packages.find]
include = ["bark", "bark.*", "bot", "bot.*", "dashboard", "dashboard.*", "database", "database.*", "services", "services.*", "modules", "modules.*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
