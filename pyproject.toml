[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bark"
version = "0.2.0"
description = "Dashboard-first Discord management platform for ZENHAWX"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [
    {name = "ZENHAWX Community"},
]

dependencies = [
    "discord.py>=2.5,<3.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "jinja2>=3.1,<4.0",
    "sqlalchemy>=2.0,<3.0",
    "aiofiles>=24.0,<25.0",
    "python-multipart>=0.0.18",
    "aiosqlite>=0.20,<1.0",
    "itsdangerous>=2.0,<3.0",
    "httpx>=0.28,<1.0",
    "pillow>=10.0,<13.0",
    "openai>=1.40,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10.0",
    "pytest-asyncio>=1.0,<2.0",
    "ruff>=0.16,<0.17",
    "mypy>=1.0,<2.0",
    "coverage[toml]>=7.0,<8.0",
    "bandit>=1.8,<2.0",
    "pip-audit>=2.9,<3.0",
    "pre-commit>=4.0,<5.0",
]

[tool.setuptools]
py-modules = ["app", "bark_version", "config"]

[tool.setuptools.packages.find]
include = ["bot", "bot.*", "dashboard", "dashboard.*", "database", "database.*", "services", "services.*", "modules", "modules.*"]

[tool.setuptools.package-data]
dashboard = ["templates/**/*.html", "static/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
exclude = [".git", ".venv", "data"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "N"]
ignore = ["N999"]

[tool.ruff.lint.per-file-ignores]
# Standalone script: imports must follow sys.path bootstrap
"run_test_server.py" = ["E402"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["data/"]

[tool.coverage.run]
branch = true
source = ["bot", "dashboard", "database", "modules", "services", "app", "config", "bark_version"]

[tool.coverage.report]
show_missing = true
skip_covered = true
