<script>
    const GUILD_ID = '{{ guild.id }}';

    async function loadSettingsHealth() {
        const statusEl = document.getElementById('settings-health-status');
        const issuesEl = document.getElementById('settings-health-issues');
        if (!statusEl || !issuesEl) return;
        try {
            const result = await safeFetch(`/api/v1/guilds/${GUILD_ID}/settings/health`, { cache: 'no-cache' });
            const health = result?.data || {};
            statusEl.textContent = health.healthy ? 'Healthy' : `Unhealthy (${health.issue_count || 0})`;
            statusEl.className = `config-health-status ${health.healthy ? 'status-good' : 'status-bad'}`;
            const issues = [];
            for (const m of health.modules || []) {
                for (const issue of m.issues || []) issues.push(`${m.module || 'module'}: ${issue}`);
            }
            issuesEl.innerHTML = issues.length ? issues.map(i => `<div class="config-health-issue">⚠️ ${escHtml(i)}</div>`).join('') : '<div class="config-health-issue">No issues</div>';
        } catch {
            statusEl.textContent = 'Unavailable';
            statusEl.className = 'config-health-status status-bad';
        }
    }

    loadSettingsHealth();

    // Scroll to the requested settings section (?section=server / ?section=instance)
    const section = new URLSearchParams(location.search).get('section');
    if (section) {
        const target = document.getElementById(section === 'instance' ? 'instance-settings' : 'server-settings');
        if (target) {
            setTimeout(() => target.scrollIntoView({ behavior: 'smooth', block: 'start' }), 60);
        }
    }

    // ── Dashboard Access (moderator roles) ────────────

    const modRolesList = document.getElementById('mod-roles-list');
    const modRolesSummary = document.getElementById('mod-roles-summary');
    const modRolesSave = document.getElementById('dashboard-mod-roles-save');
    const modRolesStatus = document.getElementById('dashboard-mod-roles-status');

    function refreshModRolesSummary() {
        if (!modRolesSummary) return;
        const checked = Array.from(
            document.querySelectorAll('#mod-roles-list input[type="checkbox"]:checked')
        );
        if (!checked.length) {
            modRolesSummary.textContent = 'No moderator roles…';
            return;
        }
        // List the actual names of every selected role so the closed
        // dropdown reflects exactly who is selected.
        const names = checked.map(cb => {
            const label = cb.closest('label');
            return label ? label.querySelector('span')?.textContent?.trim() : '';
        }).filter(Boolean);
        modRolesSummary.textContent = names.join(', ');
    }

    async function loadDashboardModRoles() {
        if (!modRolesList) return;
        try {
            const [rolesResult, settingsResult] = await Promise.all([
                safeFetch(`/api/v1/guilds/${GUILD_ID}/roles`, { cache: 'no-cache' }),
                safeFetch(`/api/v1/guilds/${GUILD_ID}/settings`, { cache: 'no-cache' }),
            ]);
            const roles = (rolesResult?.data?.roles) || [];
            const settings = (settingsResult?.data?.settings) || {};
            // Saved moderator roles: JSON array (["111","222"]) or legacy
            // plain single id / comma list.
            const savedRaw = String(settings['dashboard_moderator_roles'] || '').trim();
            let selected = new Set();
            if (savedRaw.startsWith('[')) {
                try {
                    const parsed = JSON.parse(savedRaw);
                    if (Array.isArray(parsed)) parsed.forEach(id => selected.add(String(id)));
                } catch { selected = new Set(); }
            } else {
                savedRaw.split(',').map(s => s.trim()).filter(Boolean).forEach(id => selected.add(String(id)));
            }
            modRolesList.innerHTML = roles.length
                ? roles.map(r =>
                    `<label class="checkbox-role-row">
                        <input type="checkbox" name="dashboard_moderator_roles" value="${escHtml(r.id)}"${selected.has(String(r.id)) ? ' checked' : ''}>
                        <span>${escHtml(r.name)}</span>
                    </label>`
                  ).join('')
                : '<p class="text-tertiary" style="padding:6px 8px;">No roles in this server</p>';
            modRolesList.querySelectorAll('input[type="checkbox"]').forEach(cb =>
                cb.addEventListener('change', refreshModRolesSummary)
            );
            refreshModRolesSummary();

            // Saved admin role: single id (or empty).
            const adminRaw = String(settings['dashboard_admin_role'] || '').trim();
            let adminId = '';
            if (adminRaw.startsWith('"')) {
                try { adminId = JSON.parse(adminRaw) || ''; } catch { adminId = ''; }
            } else {
                adminId = adminRaw;
            }
            const adminSelect = document.getElementById('dashboard-admin-role');
            if (adminSelect) {
                adminSelect.innerHTML = roles.length
                    ? '<option value="">No admin role…</option>' + roles.map(r =>
                        `<option value="${escHtml(r.id)}"${adminId === String(r.id) ? ' selected' : ''}>${escHtml(r.name)}</option>`
                      ).join('')
                    : '<option value="">No roles in this server</option>';
            }

            // Custom link (URL slug).
            const slugInput = document.getElementById('slug-input');
            const slugClear = document.getElementById('slug-clear');
            const slugPreview = document.getElementById('slug-preview');
            const slugPrefix = document.getElementById('slug-prefix');
            if (slugPrefix) slugPrefix.textContent = location.origin.replace(/\/$/, '') + '/g/';
            if (slugInput) {
                slugInput.value = settings['slug'] || '';
                if (slugPreview) slugPreview.textContent = '/g/' + (settings['slug'] || '…');
                if (slugClear) slugClear.hidden = !settings['slug'];
            }
        } catch {
            modRolesList.innerHTML = '<p class="text-tertiary" style="padding:6px 8px;">Roles unavailable</p>';
            refreshModRolesSummary();
        }
    }

    // Reflect aria-expanded on the summary as the dropdown opens/closes.
    document.getElementById('mod-roles-dropdown')?.addEventListener('toggle', (event) => {
        const toggle = document.getElementById('mod-roles-toggle');
        if (toggle) toggle.setAttribute('aria-expanded', event.target.open ? 'true' : 'false');
    });

    modRolesSave?.addEventListener('click', async () => {
        const roleIds = Array.from(
            document.querySelectorAll('#mod-roles-list input[type="checkbox"]:checked')
        ).map(cb => cb.value);
        const adminSelect = document.getElementById('dashboard-admin-role');
        const adminRoleId = (adminSelect && adminSelect.value) || '';
        modRolesSave.disabled = true;
        if (modRolesStatus) {
            modRolesStatus.textContent = 'Saving…';
            modRolesStatus.style.color = '';
        }
        try {
            await safeFetch(`/api/v1/guilds/${GUILD_ID}/settings/general`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    dashboard_moderator_roles: JSON.stringify(roleIds),
                    dashboard_admin_role: adminRoleId,
                }),
            });
            if (modRolesStatus) {
                modRolesStatus.textContent = roleIds.length
                    ? `Saved — ${roleIds.length} moderator role(s)${adminRoleId ? ' + admin role' : ''}`
                    : (adminRoleId ? 'Saved — admin role only' : 'Saved — no staff roles');
                modRolesStatus.style.color = 'var(--green)';
            }
        } catch (error) {
            if (modRolesStatus) {
                modRolesStatus.textContent = error.message || 'Save failed';
                modRolesStatus.style.color = 'var(--red)';
            }
        } finally {
            modRolesSave.disabled = false;
        }
    });

    // ── Custom Link (URL slug) ────────────────────────
    const slugInput = document.getElementById('slug-input');
    const slugSaveBtn = document.getElementById('slug-save');
    const slugClearBtn = document.getElementById('slug-clear');
    const slugStatusEl = document.getElementById('slug-status');
    const slugPreviewEl = document.getElementById('slug-preview');

    if (slugInput) {
        slugInput.addEventListener('input', () => {
            if (slugPreviewEl) slugPreviewEl.textContent = '/g/' + (slugInput.value.trim() || '…');
        });
    }

    async function saveSlug(value) {
        if (!slugSaveBtn) return;
        const raw = value != null ? value : (slugInput ? slugInput.value.trim() : '');
        slugSaveBtn.disabled = true;
        if (slugStatusEl) { slugStatusEl.textContent = 'Saving…'; slugStatusEl.style.color = ''; }
        try {
            const res = await safeFetch(`/api/v1/guilds/${GUILD_ID}/slug`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ slug: raw }),
            });
            const d = (res && (res.data || res)) || {};
            if (slugInput) slugInput.value = d.slug || '';
            if (slugPreviewEl) slugPreviewEl.textContent = '/g/' + (d.slug || '…');
            if (slugClearBtn) slugClearBtn.hidden = !d.slug;
            if (slugStatusEl) {
                slugStatusEl.textContent = d.slug ? `Saved — ${location.origin}/g/${d.slug}` : 'Removed — no custom link.';
                slugStatusEl.style.color = 'var(--green)';
            }
        } catch (error) {
            if (slugStatusEl) { slugStatusEl.textContent = error.message || 'Save failed'; slugStatusEl.style.color = 'var(--red)'; }
        } finally {
            slugSaveBtn.disabled = false;
        }
    }

    slugSaveBtn?.addEventListener('click', () => saveSlug());
    slugClearBtn?.addEventListener('click', () => saveSlug(''));

    loadDashboardModRoles();

    // ── Updates ────────────────────────────────────────

    const updateChannel = document.getElementById('update-channel');
    const updateCurrent = document.getElementById('update-current');
    const updateAvailable = document.getElementById('update-available');
    const updateAvailableDate = document.getElementById('update-available-date');
    const updateRepo = document.getElementById('update-repo');
    const updateApplyBtn = document.getElementById('update-apply-btn');
    const updateResult = document.getElementById('update-result');

    let lastStatus = null;
    let channelInitialized = false;

    // The check runs automatically: on first load and whenever the channel
    // changes. The dropdown keeps whatever the user selected so they can
    // preview that channel's version before deciding to update.
    async function loadUpdateStatus() {
        if (!updateCurrent) return;
        try {
            // First call: let the backend report the persisted channel (no
            // branch param) so we can seed the dropdown. After that, use the
            // user's selection.
            const branch = channelInitialized ? (updateChannel?.value || 'main') : '';
            const result = await safeFetch(`/api/v1/instance/update/status${branch ? `?branch=${encodeURIComponent(branch)}` : ''}`, {cache: 'no-cache'});
            const status = result?.data || {};
            lastStatus = status;

            // Seed the dropdown from the persisted channel once. On a Dev
            // instance the Stable option stays disabled (one-way switch).
            if (!channelInitialized && status.channel) {
                channelInitialized = true;
                updateChannel.value = status.channel === 'dev' ? 'dev' : 'main';
                const stableOption = updateChannel.querySelector('option[value="main"]');
                if (stableOption) stableOption.disabled = status.channel === 'dev';
                const hint = document.getElementById('update-channel-hint');
                if (hint && status.channel === 'dev') {
                    hint.textContent = 'This instance is on the Dev channel. Switching back to Stable is not allowed.';
                }
            } else if (status.channel) {
                const hint = document.getElementById('update-channel-hint');
                if (hint && status.channel === 'dev') {
                    hint.textContent = 'This instance is on the Dev channel. Switching back to Stable is not allowed.';
                }
            }

            updateCurrent.textContent = status.current_version ? `v${status.current_version}` : '—';
            if (updateRepo) {
                const repo = status.repo_url || 'https://github.com';
                updateRepo.href = repo;
                updateRepo.textContent = repo.replace(/^https?:\/\//, '');
            }
            const releasesEl = document.getElementById('update-releases');
            if (releasesEl && status.repo_url) {
                releasesEl.href = `${status.repo_url.replace(/\/$/, '')}/releases`;
            }
            updateAvailable.textContent = status.available_version ? `v${status.available_version}` : '—';
            if (updateAvailableDate) {
                updateAvailableDate.textContent = status.available_date
                    ? `· released ${new Date(status.available_date).toLocaleString()}`
                    : '';
            }
            updateApplyBtn.disabled = !status.update_available;
            if (updateResult) {
                updateResult.innerHTML = status.update_available
                    ? `<div class="state-panel"><div><strong>Update available</strong><p>v${escHtml(status.available_version || '?')} is ready — pull it from GitHub and restart the instance. A database backup is created automatically before updating.</p></div></div>`
                    : (status.error ? `<div class="state-panel state-error"><div><strong>Check failed</strong><p>${escHtml(status.error)}</p></div></div>` : '');
            }
        } catch (error) {
            updateCurrent.textContent = '—';
            updateApplyBtn.disabled = true;
            if (updateResult) updateResult.innerHTML = `<div class="state-panel state-error"><div><strong>Update check unavailable</strong><p>${escHtml(error.message || 'Could not reach the update API')}</p></div></div>`;
        }
    }

    // Auto-check on load and whenever the channel changes — no Check button.
    updateChannel?.addEventListener('change', loadUpdateStatus);
    loadUpdateStatus();
    // ── Live update terminal ──────────────────────────

    const termOverlay = document.getElementById('update-terminal-overlay');
    const termLog = document.getElementById('update-terminal-log');
    const termClose = document.getElementById('update-terminal-close');
    const termSubtitle = document.getElementById('update-terminal-subtitle');
    const termProgress = document.getElementById('update-progress');
    const termProgressFill = document.getElementById('update-progress-fill');
    const termProgressLabel = document.getElementById('update-progress-label');
    const termProgressEta = document.getElementById('update-progress-eta');
    let termTimer = null;
    let termAfter = 0;
    let termWaitingForRestart = false;

    const PHASE_LABELS = {
        fetch: 'Fetching the new build from GitHub…',
        backup: 'Backing up the database…',
        reset: 'Applying the new build…',
        deps: 'Installing dependencies…',
        restart: 'Restarting the instance…',
    };
    const PHASE_ETA = {fetch: 10, backup: 5, reset: 5, deps: 45, restart: 15};
    const TERMINAL_RESTART_TIMEOUT = 75; // seconds before giving up on the restart

    function setProgress(phase, phases, done) {
        if (!termProgress) return;
        const idx = (phases || []).indexOf(phase);
        if (done) {
            termProgress.hidden = false;
            termProgressFill.style.width = '100%';
            termProgressLabel.textContent = 'Finished';
            termProgressEta.textContent = '';
            return;
        }
        if (idx < 0) { termProgress.hidden = true; return; }
        termProgress.hidden = false;
        termProgressFill.style.width = `${Math.round(((idx + 1) / (phases.length || 5)) * 100)}%`;
        termProgressLabel.textContent = PHASE_LABELS[phase] || phase;
        const eta = PHASE_ETA[phase];
        termProgressEta.textContent = eta ? `~${eta}s remaining` : '';
    }

    function finishTerminal(message, level) {
        if (termTimer) { clearInterval(termTimer); termTimer = null; }
        termClose.disabled = false;
        appendTermLine({level: level || 'ok', line: message});
        if (termSubtitle) termSubtitle.textContent = 'Update finished.';
        if (termProgress) {
            termProgress.hidden = false;
            termProgressFill.style.width = '100%';
            termProgressLabel.textContent = level === 'error' ? 'Update failed' : 'Finished';
            termProgressEta.textContent = '';
        }
    }

    function appendTermLine(entry) {
        if (!termLog) return;
        const line = document.createElement('div');
        line.className = `t-${entry.level || 'info'}`;
        line.textContent = `${entry.ts || ''}  ${entry.line || ''}`;
        termLog.appendChild(line);
        termLog.scrollTop = termLog.scrollHeight;
    }

    function openUpdateTerminal() {
        if (!termOverlay) return;
        termAfter = 0;
        termWaitingForRestart = false;
        termLog.innerHTML = '';
        if (termSubtitle) termSubtitle.textContent = 'Running update commands — this window shows exactly what is happening.';
        termClose.disabled = true;
        termOverlay.hidden = false;
        // Move focus into the dialog so keyboard/screen-reader users aren't
        // stranded on the background page while the update runs. The dialog
        // only closes via the "Finish & Reload" page reload, so there is no
        // need for a focus trap / Escape handler (there is nothing to cancel).
        const termFocusTarget = termOverlay.querySelector('.update-terminal, button, [tabindex]');
        if (termFocusTarget) termFocusTarget.focus();
        termTimer = setInterval(pollUpdateLog, 900);
        pollUpdateLog();
    }

    async function pollUpdateLog() {
        if (!termOverlay || termOverlay.hidden) return;
        try {
            const result = await safeFetch(`/api/v1/instance/update/log?after=${termAfter}`, {cache: 'no-cache'});
            const data = result?.data || {};
            (data.entries || []).forEach(appendTermLine);
            termAfter = data.last || termAfter;
            setProgress(data.phase, data.phases, data.done);
            if (data.done === true && data.active === false && termAfter > 0) {
                finishTerminal('— Finished.');
            } else if (data.phase === 'restart') {
                // The process exits right after this phase — switch to
                // restart-watching instead of waiting for the poll to fail.
                waitForRestart();
            }
        } catch (error) {
            // The instance restarted mid-update (os._exit) — polls briefly
            // fail. Watch for the instance to come back, then reload.
            waitForRestart();
        }
    }

    function waitForRestart() {
        if (termWaitingForRestart) return;
        termWaitingForRestart = true;
        if (termTimer) { clearInterval(termTimer); termTimer = null; }
        if (termSubtitle) termSubtitle.textContent = 'Restarting — waiting for the instance to come back online…';
        if (termProgress) {
            termProgress.hidden = false;
            termProgressFill.style.width = '100%';
            termProgressLabel.textContent = 'Restarting…';
            termProgressEta.textContent = 'usually a few seconds';
        }
        appendTermLine({level: 'dim', line: '…waiting for the instance to come back online'});
        const started = Date.now();
        const healthTimer = setInterval(async () => {
            try {
                const health = await safeFetch('/api/v1/health', {cache: 'no-cache'});
                const bot = health?.data?.bot;
                if (health?.data?.status === 'healthy') {
                    clearInterval(healthTimer);
                    if (bot?.connected === false) {
                        appendTermLine({level: 'warn', line: '⚠ Instance is back, but the bot is not connected to Discord yet — check the service logs if servers stay empty.'});
                        finishTerminal('⚠ Instance restarted, but the bot has not connected to Discord. If servers still look empty, restart the bark service.', 'error');
                    } else {
                        appendTermLine({level: 'ok', line: '✓ Instance is back online — the update is complete.'});
                        finishTerminal('Update complete — click Finish & Reload to see the new version.', 'ok');
                    }
                }
            } catch (error) {
                // still restarting — keep waiting
            }
            if (Date.now() - started > TERMINAL_RESTART_TIMEOUT * 1000) {
                clearInterval(healthTimer);
                finishTerminal('⚠ The instance did not come back within the expected time. It may need a service restart (systemctl restart bark).', 'error');
            }
        }, 2000);
    }

    // The terminal never just closes: the only action is Finish & Reload,
    // which refreshes the page onto the new build.
    termClose?.addEventListener('click', () => {
        window.location.reload();
    });

    updateApplyBtn?.addEventListener('click', async () => {
        if (!lastStatus?.update_available) return;
        const channel = updateChannel?.value || 'main';
        const branchLabel = lastStatus.branch || channel;
        const ok = await BarkDialog.confirm({
            title: `Update to v${lastStatus.available_version || 'latest'}?`,
            message: `Pull ${lastStatus.available_version ? `version ${lastStatus.available_version} ` : 'the latest build '}from GitHub (${branchLabel}) and restart the instance? The dashboard will briefly go offline.`,
            confirmLabel: 'Update & restart',
            danger: false,
        });
        if (!ok) return;
        updateApplyBtn.disabled = true;
        try {
            const result = await safeFetch('/api/v1/instance/update', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({branch: channel}),
            });
            if (result.success === false) throw new Error(result.error || 'Update failed');
            const backupNote = result.data?.backup?.filename
                ? ` Database backed up as ${escHtml(result.data.backup.filename)}.`
                : '';
            updateResult.innerHTML = `<div class="state-panel"><div><strong>${escHtml(result.data?.message || 'Update started')}</strong><p>Watch the terminal — then click Finish &amp; Reload once the update is done.${backupNote}</p></div></div>`;
            openUpdateTerminal();
        } catch (error) {
            updateApplyBtn.disabled = false;
            updateResult.innerHTML = `<div class="state-panel state-error"><div><strong>Update failed</strong><p>${escHtml(error.message || 'Could not start the update')}</p></div></div>`;
        }
    });

    // Fire the status fetch AFTER the consts above are initialized — calling
    // loadUpdateStatus() earlier (top-level, pre-declaration) hit the
    // temporal-dead-zone and aborted the whole settings script (P0, 2026-08-09).
    loadUpdateStatus();

    // ── Diagnostics ──────────────────────────────────

    const diagnosticsBtn = document.getElementById('diagnostics-download-btn');
    const diagnosticsResult = document.getElementById('diagnostics-result');
    if (diagnosticsBtn) {
        diagnosticsBtn.addEventListener('click', async () => {
            if (diagnosticsResult) diagnosticsResult.textContent = 'Preparing report…';
            try {
                // Plain fetch: this endpoint returns the report as text/plain,
                // not the JSON envelope safeFetch expects.
                const res = await fetch('/api/v1/instance/diagnostics', { cache: 'no-cache' });
                if (res.status === 401) {
                    window.location.href = '/auth/login';
                    return;
                }
                if (!res.ok) {
                    const body = await res.json().catch(() => null);
                    throw new Error(body?.error || `Request failed (${res.status})`);
                }
                const text = await res.text();
                let filename = `bark-diagnostics-${Date.now()}.txt`;
                const cd = res.headers.get('Content-Disposition') || '';
                const match = cd.match(/filename="([^"]+)"/);
                if (match) filename = match[1];
                const url = URL.createObjectURL(new Blob([text], { type: 'text/plain' }));
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                a.remove();
                URL.revokeObjectURL(url);
                if (diagnosticsResult) diagnosticsResult.textContent = `Report downloaded (${filename}).`;
            } catch (err) {
                if (diagnosticsResult) diagnosticsResult.textContent = `Download failed: ${err.message || err}`;
            }
        });
    }

    // ── Database Backup ──────────────────────────────

    const backupCreateBtn = document.getElementById('backup-create-btn');
    const backupList = document.getElementById('backup-list');
    const dbBackupResult = document.getElementById('db-backup-result');

    function formatBytes(bytes) {
        if (!bytes && bytes !== 0) return '—';
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
        return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }

    async function loadBackups() {
        if (!backupList) return;
        try {
            const result = await safeFetch('/api/v1/instance/backups', {cache: 'no-cache'});
            if (result.success === false) throw new Error(result.error || 'Could not list backups');
            const backups = result.data?.backups || [];
            backupList.innerHTML = backups.length
                ? backups.slice(0, 8).map((b) =>
                    `<li style="display:flex;align-items:center;gap:8px;justify-content:space-between;">
                        <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escHtml(b.filename)} <span class="text-muted">(${formatBytes(b.size)})</span></span>
                        <a class="btn btn-sm" href="/api/v1/instance/backup/${encodeURIComponent(b.filename)}" download>Download</a>
                    </li>`
                ).join('')
                : '<li class="text-muted">No backups yet. Create one with Backup Now.</li>';
        } catch (error) {
            backupList.innerHTML = `<li class="text-muted">Backups unavailable — ${escHtml(error.message || 'request failed')}</li>`;
        }
    }

    backupCreateBtn?.addEventListener('click', async () => {
        backupCreateBtn.disabled = true;
        if (dbBackupResult) dbBackupResult.innerHTML = '<div class="state-panel"><div><strong>Creating backup…</strong><p>Snapshotting the database. This can take a moment.</p></div></div>';
        try {
            const result = await safeFetch('/api/v1/instance/backup', {method: 'POST'});
            if (result.success === false) throw new Error(result.error || 'Backup failed');
            const entry = result.data || {};
            if (dbBackupResult) dbBackupResult.innerHTML = `<div class="state-panel"><div><strong>Backup created</strong><p>${escHtml(entry.filename)} (${formatBytes(entry.size)}) — <a href="/api/v1/instance/backup/${encodeURIComponent(entry.filename)}" download>download</a></p></div></div>`;
            await loadBackups();
            showToast('Database backup created', 'success');
        } catch (error) {
            if (dbBackupResult) dbBackupResult.innerHTML = `<div class="state-panel state-error"><div><strong>Backup failed</strong><p>${escHtml(error.message || 'Could not create the backup')}</p></div></div>`;
        } finally {
            backupCreateBtn.disabled = false;
        }
    });

    loadBackups();

    // ── Backup & Restore ──────────────────────────────

    const backupExportBtn = document.getElementById('backup-export-btn');
    const backupFileInput = document.getElementById('backup-file-input');
    const backupFileName = document.getElementById('backup-file-name');
    const backupImportBtn = document.getElementById('backup-import-btn');
    const backupResult = document.getElementById('backup-result');

    backupExportBtn?.addEventListener('click', async () => {
        try {
            backupExportBtn.disabled = true;
            const result = await safeFetch(`/api/v1/guilds/${GUILD_ID}/settings/export`, { cache: 'no-cache' });
            if (result.success === false) throw new Error(result.error || 'Export failed');
            const backup = result.data?.backup;
            if (!backup) throw new Error('Empty export payload');
            const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `bark-backup-${GUILD_ID}-${new Date().toISOString().slice(0, 10)}.json`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
            showToast('Backup exported — edit it in any text editor and re-import when ready', 'success');
        } catch (error) {
            showToast(error.message || 'Export failed', 'error');
        } finally {
            backupExportBtn.disabled = false;
        }
    });

    backupFileInput?.addEventListener('change', () => {
        const file = backupFileInput.files?.[0];
        if (backupFileName) backupFileName.textContent = file ? file.name : 'No file selected';
        if (backupImportBtn) backupImportBtn.disabled = !file;
        if (backupResult) backupResult.hidden = true;
    });

    backupImportBtn?.addEventListener('click', async () => {
        const file = backupFileInput.files?.[0];
        if (!file) return;
        // Disable FIRST: file reads/uploads are otherwise a double-submit window.
        backupImportBtn.disabled = true;
        backupImportBtn.textContent = 'Validating and importing…';
        try {
            const isDatabase = file.name.toLowerCase().endsWith('.db');
            let result;
            if (isDatabase) {
                const form = new FormData();
                form.append('file', file);
                result = await safeFetch('/api/v1/instance/backup/restore', {
                    method: 'POST',
                    body: form,
                    timeout: 120000,
                });
                if (result.success === false) throw new Error(result.error || 'Database restore failed');
                const data = result.data || {};
                if (backupResult) {
                    backupResult.hidden = false;
                    backupResult.innerHTML = `<div class="state-panel"><div><strong>Database restore validated</strong><p>${escHtml(data.source_name || file.name)} passed SQLite integrity and Bark-schema checks. Bark is restarting now to apply it and run v0.3 migrations; the current database is retained as a rollback snapshot.</p><p><code>${escHtml(data.sha256 || '')}</code></p></div></div>`;
                }
                showToast('Database restore validated — restarting Bark', 'success');
                const restart = await safeFetch('/api/v1/instance/backup/restore/apply', {
                    method: 'POST',
                    timeout: 10000,
                });
                if (restart.success === false) throw new Error(restart.error || 'Could not restart Bark');
            } else {
                const text = await file.text();
                const parsed = JSON.parse(text);
                const backup = parsed.backup || parsed;
                if (backup.format !== 'bark-backup') throw new Error('Not a Bark settings backup file');
                result = await safeFetch(`/api/v1/guilds/${GUILD_ID}/settings/import`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ backup })
                });
                if (result.success === false) throw new Error(result.error || 'Import failed');
                const report = (result.data?.report || []).map((line) => `<div class="info-row"><span class="info-value">${escHtml(line)}</span></div>`).join('');
                if (backupResult) {
                    backupResult.hidden = false;
                    backupResult.innerHTML = `<div class="state-panel"><div><strong>Settings import complete</strong>${report}</div></div>`;
                }
                showToast('Settings backup imported', 'success');
            }
        } catch (error) {
            if (backupResult) {
                backupResult.hidden = false;
                backupResult.innerHTML = `<div class="state-panel state-error"><div><strong>Import failed</strong><p>${escHtml(error.message || 'The selected backup could not be imported.')}</p></div></div>`;
            }
            showToast(error.message || 'Import failed', 'error');
        } finally {
            backupImportBtn.disabled = !backupFileInput?.files?.[0];
            backupImportBtn.innerHTML = '{{ icon("package-plus", 14) }} Import backup';
            refreshIcons();
        }
    });

    // ── Bot Customization ─────────────────────────────────

    // Appearance data
    const avatarPreview = document.getElementById('bot-avatar-preview');
    const avatarName = document.getElementById('bot-avatar-name');
    const avatarUpload = document.getElementById('avatar-upload');
    const avatarUploadButton = document.querySelector('label[for="avatar-upload"]');
    const bannerPreview = document.getElementById('bot-banner-preview');
    const bannerMissing = document.getElementById('banner-missing');
    const bannerUpload = document.getElementById('banner-upload');
    const bannerStatus = document.getElementById('banner-status');
    const botNameForm = document.getElementById('bot-name-form');
    const botNameInput = document.getElementById('bot-name-input');
    const appearanceForm = document.getElementById('bot-presence-form');

    avatarPreview?.addEventListener('error', function() {
        this.style.display = 'none';
        const fallback = document.getElementById('bot-avatar-fallback');
        if (fallback) fallback.style.display = '';
    });

    async function loadBotAppearance() {
        if (!avatarPreview) return;
        try {
            const result = await safeFetch(`/api/v1/guilds/${GUILD_ID}/bot/appearance`, {cache: 'no-cache'});
            const data = result?.data || {};
            // Avatar
            if (data.avatar_url) {
                avatarPreview.src = safeResourceUrl(data.avatar_url, '');
                avatarPreview.style.display = '';
                document.getElementById('bot-avatar-fallback').style.display = 'none';
            }
            if (avatarName) avatarName.textContent = data.username || 'Unknown';
            // Banner
            if (data.banner_url) {
                bannerPreview.src = safeResourceUrl(data.banner_url, '');
                bannerPreview.style.display = '';
                if (bannerMissing) bannerMissing.style.display = 'none';
            } else {
                bannerPreview.style.display = 'none';
                if (bannerMissing) bannerMissing.style.display = '';
            }
            // Name input
            if (botNameInput && data.username) botNameInput.value = data.username;
            // Presence
            const typeSelect = document.getElementById('bot-activity-type');
            const nameInput = document.getElementById('bot-activity-name');
            if (typeSelect && data.activity_type) typeSelect.value = data.activity_type;
            if (nameInput && data.activity_name) nameInput.value = data.activity_name;
        } catch (error) {
            const errBox = document.getElementById('bot-custom-error');
            const msgEl = document.getElementById('bot-custom-error-message');
            if (errBox) {
                if (msgEl) msgEl.textContent = error.message || 'The bot appearance settings couldn\'t be loaded.';
                errBox.hidden = false;
            }
            showToast('Could not load bot appearance: ' + (error.message || 'Unknown error'), 'error');
        }
    }

    // Retry appearance load after an inline error
    const botCustomRetry = document.getElementById('bot-custom-retry');
    botCustomRetry?.addEventListener('click', async () => {
        const errBox = document.getElementById('bot-custom-error');
        if (errBox) errBox.hidden = true;
        await loadBotAppearance();
    });

    // Avatar upload
    avatarUpload?.addEventListener('change', async () => {
        const file = avatarUpload.files?.[0];
        if (!file) return;
        const formData = new FormData();
        formData.append('file', file);
        if (avatarUploadButton) avatarUploadButton.textContent = 'Uploading...';
        avatarUpload.disabled = true;
        try {
            const result = await safeFetch(`/api/v1/guilds/${GUILD_ID}/bot/appearance/avatar`, {
                method: 'POST',
                body: formData,
            });
            if (result.success === false) throw new Error(result.error || 'Upload failed');
            showToast('Avatar updated', 'success');
            await loadBotAppearance();
        } catch (error) {
            showToast(error.message || 'Avatar upload failed', 'error');
        } finally {
            if (avatarUploadButton) avatarUploadButton.textContent = 'Upload avatar';
            avatarUpload.disabled = false;
            avatarUpload.value = '';
        }
    });

    // Banner upload
    bannerUpload?.addEventListener('change', async () => {
        const file = bannerUpload.files?.[0];
        if (!file) return;
        if (bannerUpload.disabled) return;
        const formData = new FormData();
        formData.append('file', file);
        if (bannerStatus) bannerStatus.textContent = 'Uploading...';
        bannerUpload.disabled = true;
        try {
            const result = await safeFetch(`/api/v1/guilds/${GUILD_ID}/bot/appearance/banner`, {
                method: 'POST',
                body: formData,
            });
            if (result.success === false) throw new Error(result.error || 'Upload failed');
            showToast(result.data?.message || 'Banner updated', 'success');
            if (bannerStatus) bannerStatus.textContent = 'Banner updated';
            await loadBotAppearance();
        } catch (error) {
            showToast(error.message || 'Banner upload failed', 'error');
            if (bannerStatus) bannerStatus.textContent = error.message || 'Upload failed';
        } finally {
            bannerUpload.disabled = false;
            bannerUpload.value = '';
        }
    });

    // Bot name save
    botNameForm?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = e.target.querySelector('button[type="submit"]');
        const name = botNameInput?.value?.trim();
        if (!name || name.length < 2) { showToast('Name must be at least 2 characters', 'error'); return; }
        btn.disabled = true; btn.textContent = 'Saving...';
        try {
            const result = await safeFetch(`/api/v1/guilds/${GUILD_ID}/bot/appearance/name`, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({name}),
            });
            if (result.success === false) throw new Error(result.error || 'Update failed');
            showToast('Bot name updated', 'success');
            await loadBotAppearance();
        } catch (error) {
            showToast(error.message || 'Failed to update name', 'error');
        } finally {
            btn.disabled = false; btn.innerHTML = '{{ icon("save", 14) }} Save';
            refreshIcons();
        }
    });

    // Presence form
    appearanceForm?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('bot-presence-save');
        btn.disabled = true;
        btn.innerHTML = 'Saving...';
        const data = {
            activity_type: document.getElementById('bot-activity-type').value,
            activity_name: document.getElementById('bot-activity-name').value.trim(),
        };
        try {
            const result = await safeFetch(`/api/v1/guilds/${GUILD_ID}/bot/appearance/presence`, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data),
            });
            if (result.success === false) throw new Error(result.error || 'Update failed');
            showToast('Presence updated', 'success');
        } catch (error) {
            showToast(error.message || 'Failed to update presence', 'error');
        } finally {
            btn.disabled = false;
            btn.innerHTML = '{{ icon("save", 16) }} Update presence';
            refreshIcons();
        }
    });

    const inviteForm = document.getElementById('instance-invite-form');
    const inviteList = document.getElementById('instance-invite-list');
    async function loadInstanceInvites() {
        if (!inviteList) return;
        try {
            const result = await safeFetch('/api/v1/instance/invites');
            const invites = result.data?.invites || [];
            const accessResult = await safeFetch('/api/v1/instance/access');
            const grants = accessResult.data?.access || [];
            const inviteRows = invites.map((invite) => `<div class="info-row"><span class="info-label">${escHtml(invite.note || 'Invite #' + invite.id)}</span><span class="info-value">${invite.redeemed_at ? 'Redeemed' : invite.revoked_at ? 'Revoked' : 'Pending'} · expires ${new Date(invite.expires_at).toLocaleDateString()} ${!invite.redeemed_at && !invite.revoked_at ? `<button type="button" class="btn btn-xs" data-revoke-invite="${invite.id}">Revoke</button>` : ''}</span></div>`).join('');
            const accessRows = grants.map((grant) => `<div class="info-row"><span class="info-label">Discord user ${escHtml(grant.discord_user_id)}</span><span class="info-value">${grant.revoked_at ? 'Revoked' : 'Active'}${!grant.revoked_at ? ` <button type="button" class="btn btn-xs" data-revoke-access="${escHtml(grant.discord_user_id)}">Revoke access</button>` : ''}</span></div>`).join('');
            inviteList.innerHTML = inviteRows || accessRows ? `${inviteRows}${accessRows}` : '<p class="text-tertiary">No access links created yet.</p>';
        } catch (error) {
            inviteList.innerHTML = `<p class="text-tertiary">Access list unavailable — ${escHtml(error.message || 'request failed')}</p>`;
        }
    }
    inviteForm?.addEventListener('submit', async (event) => {
        event.preventDefault(); const button = document.getElementById('instance-invite-create'); button.disabled = true;
        try {
            const result = await safeFetch('/api/v1/instance/invites', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({expires_in_days: Number(document.getElementById('instance-invite-days').value), note: document.getElementById('instance-invite-note').value.trim()})});
            if (result.success === false) throw new Error(result.error || 'Could not create invite');
            document.getElementById('instance-invite-url').value = result.data.share_url;
            document.getElementById('instance-invite-result').hidden = false;
            await loadInstanceInvites(); showToast('Secure invite link created', 'success');
        } catch (error) { showToast(error.message || 'Could not create invite', 'error'); }
        finally { button.disabled = false; }
    });
    document.getElementById('instance-invite-copy')?.addEventListener('click', async () => {
        const text = document.getElementById('instance-invite-url').value;
        try {
            if (navigator.clipboard && window.isSecureContext) {
                await navigator.clipboard.writeText(text);
            } else {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed'; ta.style.opacity = '0';
                document.body.appendChild(ta); ta.select();
                document.execCommand('copy'); ta.remove();
            }
            showToast('Invite link copied', 'success');
        } catch { showToast('Could not copy invite link', 'error'); }
    });
    inviteList?.addEventListener('click', async (event) => {
        const button = event.target.closest('[data-revoke-invite], [data-revoke-access]');
        if (!button) return;
        const kind = button.dataset.revokeInvite ? 'invite' : 'access grant';
        const ok = await BarkDialog.confirm({ title: `Revoke ${kind}?`, message: `This immediately removes the ${kind} and cannot be undone.`, confirmLabel: 'Revoke', danger: true });
        if (!ok) return;
        try {
            if (button.dataset.revokeInvite) await safeFetch(`/api/v1/instance/invites/${button.dataset.revokeInvite}`, {method: 'DELETE'});
            if (button.dataset.revokeAccess) await safeFetch(`/api/v1/instance/access/${encodeURIComponent(button.dataset.revokeAccess)}`, {method: 'DELETE'});
            await loadInstanceInvites();
            showToast(`${kind[0].toUpperCase() + kind.slice(1)} revoked`, 'success');
        } catch (error) { showToast(error.message || `Could not revoke ${kind}`, 'error'); }
    });
    loadInstanceInvites();

    loadBotAppearance();
</script>
