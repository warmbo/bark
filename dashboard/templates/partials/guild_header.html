<div class="guild-bar">
    <div class="guild-bar-info">
        {% if guild.icon %}
        <img src="{{ guild.icon.url }}" alt="" class="guild-bar-icon">
        {% else %}
        <div class="guild-bar-icon guild-bar-placeholder">{{ guild.name[:2] }}</div>
        {% endif %}
        <div>
            <h1 class="guild-bar-name">{{ guild.name }}</h1>
            <span class="guild-bar-id">ID: {{ guild.id }}</span>
        </div>
    </div>
</div>
