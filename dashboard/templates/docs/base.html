<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Bark Docs{% endblock %}</title>
<meta name="description" content="{% block description %}Bark documentation — every command, setting, and module.{% endblock %}">
<meta name="robots" content="index, follow">
<meta property="og:site_name" content="Bark">
<meta property="og:title" content="{% block og_title %}Bark Docs{% endblock %}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ public_url }}/docs">
<meta property="og:image" content="{{ public_url }}/static/img/bark-og.png">
<meta name="theme-color" content="#2563eb">
<link rel="icon" type="image/png" href="/static/img/bark-avatar.png">
<link rel="preload" href="/static/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'Inter';src:url('/static/fonts/inter-latin.woff2') format('woff2');font-style:normal;font-weight:100 900;font-display:swap}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080b12;--panel:#0d1220;--panel-2:#111a2e;--border:rgba(96,165,250,.16);--border-strong:rgba(96,165,250,.3);
  --text:#e7ecf5;--muted:#9aa6bd;--dim:#6b768d;--accent:#3b82f6;--accent-2:#60a5fa;
  --mod:#f59e0b;--admin:#ef4444;--member:#22c55e;--mono:'SFMono-Regular',Consolas,monospace;
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.55;font-size:15px}
a{color:var(--accent-2);text-decoration:none}
a:hover{text-decoration:underline}
.layout{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
/* Sidebar */
.sidebar{background:var(--panel);border-right:1px solid var(--border);padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px;border-bottom:1px solid var(--border)}
.brand img{width:34px;height:34px;border-radius:8px}
.brand .name{font-weight:700;font-size:16px;letter-spacing:.2px}
.brand .sub{font-size:11px;color:var(--dim)}
.nav{list-style:none;margin-top:14px}
.nav a{display:block;padding:7px 10px;border-radius:7px;color:var(--muted);font-size:14px;font-weight:500}
.nav a:hover{background:var(--panel-2);color:var(--text);text-decoration:none}
.nav a.active{background:var(--accent);color:#fff}
.nav .head{margin:16px 8px 6px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim)}
.sidebar .foot{margin-top:24px;padding:0 8px;font-size:12px;color:var(--dim)}
/* Main */
.main{min-width:0;padding:32px 40px 64px}
.breadcrumb{font-size:13px;color:var(--dim);margin-bottom:8px}
.breadcrumb a{color:var(--muted)}
.breadcrumb span{margin:0 6px}
h1{font-size:28px;font-weight:700;margin-bottom:4px}
h2{font-size:20px;font-weight:650;margin:30px 0 12px}
h3{font-size:16px;font-weight:600;margin:22px 0 8px}
.lead{color:var(--muted);max-width:760px;margin-bottom:22px}
p{color:var(--muted);max-width:760px}
code{font-family:var(--mono);background:var(--panel-2);border:1px solid var(--border);border-radius:5px;padding:1px 6px;font-size:13px;color:var(--text)}
/* Cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px;display:block;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--border-strong);transform:translateY(-1px);text-decoration:none}
.card h3{color:var(--text);margin:0 0 4px;font-size:15px}
.card .ver{color:var(--dim);font-size:12px;margin-left:6px;font-weight:400}
.card p{font-size:13px;color:var(--muted);margin:0}
.card .meta{margin-top:10px;font-size:12px;color:var(--dim);display:flex;gap:12px;flex-wrap:wrap}
/* Tables */
table{width:100%;border-collapse:collapse;font-size:13.5px;margin:8px 0 16px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--border);vertical-align:top}
th{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
td code{white-space:nowrap}
tr:hover td{background:var(--panel-2)}
/* Command list */
.cmd{display:flex;align-items:baseline;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.cmd:last-child{border-bottom:none}
.cmd .path{font-family:var(--mono);color:var(--text);font-size:13.5px;white-space:nowrap}
.cmd .desc{color:var(--muted);font-size:13.5px}
/* Badges */
.badge{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.badge.member{background:rgba(34,197,94,.14);color:var(--member);border:1px solid rgba(34,197,94,.3)}
.badge.moderator{background:rgba(245,158,11,.14);color:var(--mod);border:1px solid rgba(245,158,11,.3)}
.badge.admin{background:rgba(239,68,68,.14);color:var(--admin);border:1px solid rgba(239,68,68,.3)}
.badge.anyone{background:rgba(96,165,250,.12);color:var(--accent-2);border:1px solid rgba(96,165,250,.3)}
.role-key{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:6px 0 16px}
.req{color:var(--mod);font-weight:600}
.opt{color:var(--dim)}
.notfound{color:var(--muted);font-size:16px}
.notfound code{font-size:15px}
@media (max-width:820px){.layout{grid-template-columns:1fr}.sidebar{position:static;height:auto;border-right:none;border-bottom:1px solid var(--border)}.main{padding:20px 16px 48px}}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <a class="brand" href="/docs">
      <img src="/static/img/bark-avatar.png" alt="Bark">
      <div><div class="name">Bark Docs</div><div class="sub">Knowledge base</div></div>
    </a>
    <ul class="nav">
      <li><a href="/docs" class="{{ 'active' if active == 'home' else '' }}">Overview</a></li>
      <li><a href="/docs/modules" class="{{ 'active' if active == 'modules' else '' }}">Modules</a></li>
      <li><a href="/docs/commands" class="{{ 'active' if active == 'commands' else '' }}">Commands</a></li>
      <li><a href="/docs/settings" class="{{ 'active' if active == 'settings' else '' }}">Settings</a></li>
      <li><a href="/docs/permissions" class="{{ 'active' if active == 'permissions' else '' }}">Permissions</a></li>
    </ul>
    <div class="foot">
      Every command, setting, and module — generated live from the running bot, so it never drifts from code.
      <br><br><a href="/">← Back to Bark</a>
    </div>
  </aside>
  <main class="main">
    <div class="breadcrumb"><a href="/docs">Docs</a><span>/</span>{% block crumb %}Home{% endblock %}</div>
    {% block content %}{% endblock %}
  </main>
</div>
</body>
</html>
