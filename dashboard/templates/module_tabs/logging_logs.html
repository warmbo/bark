<article class="content-card workspace-data-card" data-section="logs">
  <div class="card-header">
    <div><h2 class="card-title">{{ icon("scroll-text", 16) }} Recent Logs</h2><p class="card-description">Events Bark has recorded for this server — edits, deletes, links, joins, and voice activity.</p></div>
    <div class="card-header-actions">
      <button type="button" class="btn btn-sm" data-refresh-section="logs" aria-label="Refresh logs">{{ icon("refresh-cw", 14) }} Refresh</button>
    </div>
  </div>
  <div id="logging-logs-content" aria-live="polite"><div class="skeleton skeleton-card"></div></div>
</article>
